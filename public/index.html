<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steel Quiz</title>
<meta name="description" content="Five houses of steel questions. Ten a round, two levels.">
<meta property="og:title" content="Steel Quiz">
<meta property="og:description" content="Forming, Welding, Coating, Vehicle, Steel Fun.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#E4E8E4; --panel:#F5F7F4; --ink:#15191A; --muted:#5C6663;
    --line:#C6CCC6; --zinc:#3D6580; --oxide:#9C452A; --anneal:#B8801F; --r:3px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;
    min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;padding:0 18px 40px}
  header{background:var(--ink);color:var(--panel);padding:22px 18px 18px;margin-bottom:22px;
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 7px)}
  header .inner{max-width:520px;margin:0 auto}
  h1{font-size:1.55rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  header p{color:#A9B2AE;font-size:.85rem;margin-top:6px}
  h2{font-size:1.02rem;font-weight:600}
  .sub{color:var(--muted);font-size:.85rem}
  .house{display:block;width:100%;text-align:left;cursor:pointer;background:var(--panel);
    border:1px solid var(--line);border-left:4px solid var(--zinc);border-radius:var(--r);
    padding:13px 14px;margin-bottom:9px;font:inherit;color:inherit}
  .house:active{background:#EDF0EC}
  .house[data-h="welding"]{border-left-color:var(--oxide)}
  .house[data-h="coating"]{border-left-color:#4E7A5E}
  .house[data-h="vehicle"]{border-left-color:var(--anneal)}
  .house[data-h="fun"]{border-left-color:#6B5A86}
  .house .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .house .pts{font-size:.9rem;font-weight:600;color:var(--muted);white-space:nowrap}
  .bar{height:4px;background:#D7DCD7;margin-top:9px;border-radius:2px;overflow:hidden}
  .bar span{display:block;height:100%;background:var(--zinc);width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px}
  .tag{font-size:.78rem;color:var(--muted);margin-bottom:12px}
  .tag b{color:var(--ink);font-weight:600}
  .q{font-size:1.18rem;line-height:1.35;font-weight:500;margin-bottom:18px}
  .opt{display:flex;gap:11px;align-items:center;width:100%;text-align:left;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 13px;
    margin-bottom:8px;font:inherit;color:inherit;font-size:1.02rem;min-height:52px}
  .opt:active{background:#EEF1EE}
  .opt .k{color:var(--muted);font-weight:600;font-size:.85rem;min-width:14px}
  .opt.right{border-color:var(--zinc);background:#E7EFF4;border-width:2px}
  .opt.wrong{border-color:var(--oxide);background:#F6E9E4;border-width:2px}
  .verdict{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .verdict .head{font-weight:600;margin-bottom:6px}
  .verdict.ok .head{color:var(--zinc)}
  .verdict.no .head{color:var(--oxide)}
  .verdict p{font-size:.94rem;color:#2C3331}
  .btn{display:block;width:100%;cursor:pointer;font:inherit;font-size:1rem;font-weight:600;
    background:var(--ink);color:var(--panel);border:none;border-radius:var(--r);
    padding:15px;margin-top:14px;text-align:center;text-decoration:none}
  .btn:active{background:#2A3032}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
  .btn.share{background:var(--zinc)}
  .score{font-size:2.6rem;font-weight:700;letter-spacing:-.03em;line-height:1}
  .score small{font-size:.9rem;font-weight:500;color:var(--muted);letter-spacing:0}
  .statline{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
  .statline div{font-size:.88rem;color:var(--muted)}
  .statline b{display:block;font-size:1.15rem;color:var(--ink);font-weight:600}
  footer{margin-top:26px;font-size:.78rem;color:var(--muted);line-height:1.5}
  footer button{background:none;border:none;padding:0;font:inherit;color:var(--muted);
    text-decoration:underline;cursor:pointer}
  .credit{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-size:.72rem;letter-spacing:.01em}
  button:focus-visible,a:focus-visible{outline:2px solid var(--zinc);outline-offset:2px}
</style>
</head>
<body>
<header><div class="inner">
  <h1>Steel Quiz</h1>
  <p>Five houses. Ten questions a round, two levels.</p>
</div></header>

<div class="wrap">
  <main id="view"><p class="sub">Loading…</p></main>
  <footer>
    Your score is stored on this phone and sent nowhere. Nobody sees it unless you post it.
    <button id="reset">Clear my progress</button>
    <div class="credit">&copy; Pundan K Singh &middot; IIT Madras Research Park</div>
  </footer>
</div>

<script>
/* Questions arrive one at a time from the server, without the answer. The
   answer only comes back after a choice is submitted, so nothing in this page
   or its source reveals it in advance. */

const API = {
  houses:  () => fetch('/api/houses').then(r => r.json()),
  next:    (house, level, seen) => fetch('/api/next', {
             method:'POST', headers:{'Content-Type':'application/json'},
             body: JSON.stringify({house, level, seen})
           }).then(r => r.json()),
  answer:  (id, choice) => fetch('/api/answer', {
             method:'POST', headers:{'Content-Type':'application/json'},
             body: JSON.stringify({id, choice})
           }).then(r => r.json())
};

const POINTS = {1:10, 2:20}, ROUND = 10, PROMOTE = 2;

const store = (() => {
  const KEY = 'steelquiz.v2';
  let mem = null;
  const read = () => { if (!mem) { try { mem = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ mem = {}; } } return mem; };
  return {
    house(h){ const d = read(); if (!d[h]) d[h] = {points:0, answered:0, correct:0, level:1, best:0, seen:[]}; return d[h]; },
    save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} },
    clear(){ mem = {}; try { localStorage.removeItem(KEY); } catch(e){} }
  };
})();

const view = document.getElementById('view');
let HOUSES = {}, TOTALS = {}, round = null;
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

async function boot(){
  try {
    const d = await API.houses();
    HOUSES = d.houses; TOTALS = d.totals;
    renderHouses();
  } catch (e) {
    view.innerHTML = '<div class="card"><p>Could not reach the server. Check your connection and reload.</p></div>';
  }
}

function renderHouses(){
  round = null;
  const rows = Object.entries(HOUSES).map(([key, h]) => {
    const p = store.house(key), t = TOTALS[key] || 0;
    const pct = t ? Math.round(p.seen.length / t * 100) : 0;
    const state = p.answered ? `${p.points} points · level ${p.level}` : 'not started';
    return `<button class="house" data-h="${key}">
      <div class="row"><h2>${esc(h.name)}</h2><span class="pts">${state}</span></div>
      <div class="sub">${esc(h.blurb)}</div>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <div class="sub" style="margin-top:6px">${p.seen.length} of ${t} questions seen</div>
    </button>`;
  }).join('');
  view.innerHTML = `<h2 style="margin-bottom:10px">Pick a house</h2>${rows}`;
  view.querySelectorAll('.house').forEach(b => b.onclick = () => start(b.dataset.h));
}

function start(house){
  const p = store.house(house);
  if (p.seen.length >= (TOTALS[house] || 0)) p.seen = [];
  round = {house, asked:0, right:0, streak:0};
  store.save();
  serve();
}

async function serve(){
  if (round.asked >= ROUND) return summary(false);
  const p = store.house(round.house);
  view.innerHTML = '<div class="card"><p class="sub">Loading question…</p></div>';
  const q = await API.next(round.house, p.level, p.seen);
  if (q.done) return summary(true);

  view.innerHTML = `<div class="card">
    <div class="tag"><b>${esc(HOUSES[round.house].name)}</b> · ${q.level === 1 ? 'easy' : 'hard'} · ${POINTS[q.level]} points</div>
    <div class="q">${esc(q.question)}</div>
    <div id="opts">${['A','B','C'].map(k =>
      `<button class="opt" data-k="${k}"><span class="k">${k}</span><span>${esc(q.options[k])}</span></button>`).join('')}</div>
    <div id="after"></div>
  </div>
  <button class="btn ghost" id="back">Back to houses</button>`;
  view.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(q, b.dataset.k));
  document.getElementById('back').onclick = renderHouses;
}

async function answer(q, choice){
  view.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const res = await API.answer(q.id, choice);          // answer revealed only now
  const p = store.house(round.house);

  view.querySelectorAll('.opt').forEach(b => {
    if (b.dataset.k === res.correct) b.classList.add('right');
    else if (b.dataset.k === choice) b.classList.add('wrong');
  });

  p.seen.push(q.id); p.answered += 1; round.asked += 1;
  let promoted = false;
  if (res.right){
    p.points += POINTS[q.level]; p.correct += 1; round.right += 1; round.streak += 1;
    if (round.streak > p.best) p.best = round.streak;
    if (p.level === 1 && round.streak >= PROMOTE){ p.level = 2; round.streak = 0; promoted = true; }
  } else { round.streak = 0; p.level = 1; }
  store.save();

  document.getElementById('after').innerHTML = `
    <div class="verdict ${res.right ? 'ok' : 'no'}">
      <div class="head">${res.right ? `Correct. +${POINTS[q.level]} points.` : `Not this time. The answer is ${res.correct}, ${esc(q.options[res.correct])}.`}</div>
      <p>${esc(res.explanation)}</p>
      ${promoted ? '<p style="margin-top:8px"><em>Two in a row. Hard questions from here.</em></p>' : ''}
    </div>
    <button class="btn" id="next">${round.asked >= ROUND ? 'See my score' : 'Next question'}</button>
    <button class="btn ghost" id="stop">Stop and see my score</button>`;
  document.getElementById('next').onclick = serve;
  document.getElementById('stop').onclick = () => summary(false);
}

function summary(cleared){
  const key = round.house, p = store.house(key), h = HOUSES[key];
  const clean = round.asked >= ROUND && round.right === round.asked;
  const msg = clean
    ? `🏆 *${h.name} house cleared*\n\nTen out of ten in the ${h.name} house of the Steel Quiz. ${p.points} points, no mistakes. 🔩`
    : `Steel Quiz, ${h.name}: ${p.points} points, ${p.correct} of ${p.answered} correct.`;

  view.innerHTML = `<div class="card">
    <div class="tag"><b>${esc(h.name)}</b> · ${clean ? 'clean sweep' : cleared ? 'house cleared' : 'session paused'}</div>
    <div class="score">${p.points} <small>points in this house</small></div>
    <div class="statline">
      <div>correct<b>${p.correct} of ${p.answered}</b></div>
      <div>level reached<b>${p.level === 2 ? 'hard' : 'easy'}</b></div>
      <div>best run<b>${p.best}</b></div>
    </div>
    ${clean ? '<p class="sub" style="margin-top:14px">Ten from ten. Worth telling the group about.</p>' : ''}
    <a class="btn share" href="https://wa.me/?text=${encodeURIComponent(msg)}">Post this to the group</a>
    <button class="btn ghost" id="again">Play this house again</button>
    <button class="btn ghost" id="home">Back to houses</button>
  </div>`;
  document.getElementById('again').onclick = () => start(key);
  document.getElementById('home').onclick = renderHouses;
}

document.getElementById('reset').onclick = () => {
  if (confirm('Clear your saved points and question history on this phone?')){ store.clear(); renderHouses(); }
};

boot();
</script>
</body>
</html>
